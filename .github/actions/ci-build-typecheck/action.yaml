name: ci-build-typecheck
description: Run package-contract checks and CLI, plugin, and JavaScript type checks.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Verify compiled package contracts
      shell: bash
      env:
        NPM_CONFIG_CACHE: ${{ runner.temp }}/npm
      run: npx vitest run --project package-contract

    - name: Verify NeMo Fabric runner
      shell: bash
      run: bash packages/nemoclaw-fabric/tests/run-tests.sh

    - name: Verify composed NeMo Fabric package contracts
      if: env.NEMOCLAW_RUN_PACKAGE_TESTS != 'true'
      shell: bash
      run: npx tsx scripts/packages/run-tests.mts fabric

    - name: Verify package-owned tests
      if: env.NEMOCLAW_RUN_PACKAGE_TESTS == 'true'
      shell: bash
      run: npm run test:packages

    - name: Typecheck CLI + tests
      shell: bash
      run: npm run typecheck:cli

    - name: Typecheck plugin
      shell: bash
      run: npm --prefix packages/nemoclaw-openclaw/plugin run typecheck

    - name: Typecheck JavaScript config
      shell: bash
      run: npx tsc -p jsconfig.json
