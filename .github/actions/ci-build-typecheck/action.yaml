name: ci-build-typecheck
description: Run package-contract checks and CLI, plugin, and JavaScript type checks.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Verify compiled package contracts
      shell: bash
      env:
        NPM_CONFIG_CACHE: ${{ runner.temp }}/npm
      run: npx vitest run --project package-contract

    - name: Verify NeMo Fabric package contracts
      shell: bash
      run: npm run test:fabric

    - name: Typecheck CLI + tests
      shell: bash
      run: npm run typecheck:cli

    - name: Typecheck plugin
      shell: bash
      run: npm --prefix packages/nemoclaw-openclaw/plugin run typecheck

    - name: Typecheck JavaScript config
      shell: bash
      run: npx tsc -p jsconfig.json
