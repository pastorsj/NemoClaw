# Data-only capabilities consumed by the NemoClaw agent runtime package contract.
name: pi
display_name: "Pi"
description: "Terminal coding agent with read, bash, edit, and write tools, plus session management"
version_constraint: ">=0.84.1"
language: nodejs
license: MIT
homepage: "https://pi.dev"
install_method: npm
binary_path: /usr/local/bin/pi
version_command: "pi --version"
expected_version: "0.84.1"
version_scheme: semver
managed_image:
  repository: ghcr.io/nvidia/nemoclaw/pi-sandbox
  architectures:
    - linux/amd64
    - linux/arm64
  runtime_identity:
    uid: 999
    gid: 999
    workdir: /sandbox
  workspace:
    owner: runtime
    mode: "0755"
  startup_profile_contract_version: 1
  capability_contract_version: 1
runtime:
  kind: terminal
  # Pi's login profile verifies nproc as well as nofile. Ubuntu /bin/sh cannot
  # inspect nproc, so every core-owned package probe uses this declared shell.
  command_shell: /bin/bash
  interactive_command: "pi"
  headless_command: "nemoclaw-fabric-run --deadline-seconds 120 --kill-grace-seconds 10 --config /sandbox/.pi/agent/fabric.json"
  prompt_transport: stdin
  smoke_boundary:
    kind: login-shell
  smoke_commands:
    - "pi --version"
    - "nemoclaw-fabric --version"
    - "/usr/local/bin/nemoclaw-fabric-run --help >/dev/null && echo NEMOCLAW_FABRIC_RUNNER_OK"
    - "test -s /sandbox/.pi/agent/models.json && echo NEMOCLAW_PI_MODELS_OK"
    - "test -s /sandbox/.pi/agent/fabric.json && echo NEMOCLAW_PI_FABRIC_OK"
    - 'test "$(stat -c %a /sandbox/.pi/agent/models.json)" = 600 && echo NEMOCLAW_PI_MODE_OK'
    - 'test "$(stat -c %a /sandbox/.pi/agent/fabric.json)" = 600 && echo NEMOCLAW_PI_FABRIC_MODE_OK'
config:
  dir: /sandbox/.pi/agent
  config_file: models.json
  mutable_access: private
  shields_files:
    - fabric.json
  format: json
state_dirs:
  - path: sessions
  - path: prompts
  - path: themes
  - path: tools
    backup: false
  - path: bin
    backup: false
state_files:
  - path: settings.json
    restore:
      merge: key-allowlist
      user_keys:
        - key: theme
          type: string
          max_length: 128
        - key: hideThinkingBlock
          type: boolean
        - key: showCacheMissNotices
          type: boolean
        - key: quietStartup
          type: boolean
        - key: steeringMode
          type: enum
          values:
            - all
            - one-at-a-time
        - key: followUpMode
          type: enum
          values:
            - all
            - one-at-a-time
        - key: defaultThinkingLevel
          type: enum
          values:
            - off
            - minimal
            - low
            - medium
            - high
            - xhigh
device_pairing: false
inference:
  provider_type: openai_compatible
  default_model: nvidia/nemotron-3-super-120b-a12b
  base_url_config_key: "providers.openshell.baseUrl"
  model_config_key: "defaultModel"
  proxy_support: implicit
mcp:
  support: disabled
sessions:
  operations: []
messaging:
  support: disabled
package_registry:
  hosts:
    - registry.npmjs.org
  binary: /usr/local/bin/npm
