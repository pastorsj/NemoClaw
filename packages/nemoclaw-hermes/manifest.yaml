#
# Agent manifest for Hermes Agent (Nous Research).
# Declares the integration contract between NemoClaw and the sandboxed agent.

name: hermes
display_name: "Hermes Agent"
description: "Self-improving AI agent with learning loop (Nous Research)"
aliases:
  - nemohermes
  - nemo-hermes
alias_summary: "nemohermes → hermes"
onboarding:
  sandbox_name: hermes
sandbox_create:
  generated_image_build: local-buildkit-required
version_constraint: ">=0.8.0"
language: python
license: MIT
homepage: "https://github.com/NousResearch/hermes-agent"

# ── Binary & process ────────────────────────────────────────────
install_method: curl # curl install.sh | bash
binary_path: /usr/local/bin/hermes
version_command: "hermes --version"
expected_version: "0.20.6"
# Hermes reports semver from `hermes --version` (for example, `0.20.6`) even
# though its GitHub release cadence is calendar-based (`v2026.8.27`). Declaring the
# scheme keeps the staleness check off the shape heuristic when a manifest
# could otherwise straddle both schemes (#6049).
version_scheme: semver
managed_image:
  repository: ghcr.io/nvidia/nemoclaw/hermes-sandbox
  rebuild_base_image: pinned-remote
  base_image:
    security_inventory: true
    package_probe: true
    pinned_remote:
      argument: BASE_IMAGE
      ref: ghcr.io/nvidia/nemoclaw/hermes-sandbox-base@sha256:c588bf76ba1c280f8a366bdfd672193e852de4f509a280662c7070a9b6e2fa48
  architectures:
    - linux/amd64
    - linux/arm64
  runtime_identity:
    uid: 998
    gid: 999
    workdir: /sandbox
  workspace:
    owner: runtime
    mode: "0755"
  state_root:
    mount_target: /sandbox/.hermes
    mode: "3770"
  startup_profile_environment:
    - { name: NEMOCLAW_CONTEXT_WINDOW, value_type: string, max_bytes: 32 }
gateway_command: "hermes gateway run"
# Interactive entry point a user types inside the sandbox. The explicit runtime
# kind and command let NemoClaw avoid a package-name decision.
runtime:
  kind: gateway
  gateway_log_path: /tmp/gateway.log
  command_shell: /bin/sh
  interactive_command: "hermes"
  headless_command: "nemoclaw-fabric-run --deadline-seconds 120 --kill-grace-seconds 10 --config /sandbox/.hermes/fabric.json"
  prompt_transport: stdin
  prompt_protocol: fabric-cli
  # Core invokes this package-owned controller with one finite lifecycle action
  # and a core-generated nonce. Core still owns privileged sandbox execution.
  process_lifecycle:
    support: managed
    command: [/usr/local/bin/nemoclaw-gateway-control]
    revalidate_running_gateway: true
  # These public constants must exist in the supervisor's initial environment.
  # The authenticated recovery helper validates that exact process boundary.
  startup_environment:
    HERMES_BUNDLED_PLUGINS: /opt/hermes/plugins
    HERMES_HOME: /sandbox/.hermes
    HERMES_LAZY_INSTALL_TARGET: /sandbox/.hermes/lazy-packages
  smoke_boundary:
    kind: login-shell
  smoke_commands:
    - "hermes --version"
    - "nemoclaw-fabric --version"
    - "/usr/local/bin/nemoclaw-fabric-run --help >/dev/null && echo NEMOCLAW_FABRIC_RUNNER_OK"
    - "test -s /sandbox/.hermes/fabric.json && echo NEMOCLAW_HERMES_FABRIC_OK"
    - 'test "$(stat -c %a /sandbox/.hermes/fabric.json)" = 600 && echo NEMOCLAW_HERMES_FABRIC_MODE_OK'

# ── Health probe ────────────────────────────────────────────────
# The API server adapter listens on 8642 by default and exposes
# GET /health -> {"status": "ok", "platform": "hermes-agent"}
health_probe:
  url: "http://localhost:8642/health"
  port: 8642
  port_resolution: sandbox-secondary-forward
  secondary_forward:
    environment_variable: NEMOCLAW_HERMES_API_PORT
    preferred_port: 8642
    range_start: 8642
    range_end: 8652
    label: Hermes API
    remedy: Destroy a listed Hermes sandbox or stop a listed non-OpenShell listener, then rerun onboarding.
  timeout_seconds: 90
  success_statuses: [200]

# ── Dashboard / UI ──────────────────────────────────────────────
# NemoClaw prebakes Hermes' dashboard assets and launches `hermes dashboard`
# inside the sandbox. The dashboard binds to a private loopback port; start.sh
# exposes the NemoClaw browser surface on port 18789 through socat. The
# OpenAI-compatible API remains available separately on port 8642.
dashboard:
  kind: ui
  label: "Dashboard"
  path: "/"
  health_path: "/api/status"
  auth: session
# Optional Hermes WebUI settings. NemoClaw reads these names and bounds from
# the receipt-pinned package instead of selecting Hermes behavior by package ID.
dashboard_ui:
  label: Hermes dashboard
  path: /
  port: 9119
  enable_env: NEMOCLAW_HERMES_DASHBOARD
  port_env: NEMOCLAW_HERMES_DASHBOARD_PORT
  internal_port: 19119
  internal_port_env: NEMOCLAW_HERMES_DASHBOARD_INTERNAL_PORT
  tui_env: NEMOCLAW_HERMES_DASHBOARD_TUI
forward_ports:
  - 18789
  - 8642

# ── Configuration ───────────────────────────────────────────────
config:
  dir: /sandbox/.hermes
  config_file: config.yaml
  env_file: .env # relative to dir — API keys
  auth_file: auth.json # OAuth tokens (Nous Portal, Codex, etc.)
  format: yaml

# ── State lifecycle ────────────────────────────────────────────
state_lifecycle:
  backup_quiescence:
    kind: not-required
  snapshot_restore: [restart-runtime]
  rebuild:
    managed_extensions:
      support: disabled
      reason: Hermes does not preserve image-owned extensions during rebuild.
    preserved_environment:
      files:
        - path: .env
          patterns: ["*_HOME_CHANNEL", "*_HOME_CHANNEL_NAME", "*_HOME_CHANNEL_THREAD_ID"]
          render_target: ~/.hermes/.env
    scheduled_work:
      support: managed
      controller:
        command:
          - /opt/hermes/.venv/bin/python
          - -I
          - /usr/local/lib/nemoclaw/hermes-cron-restore-control.py
        timeout_seconds: 180
      jobs_path: cron/jobs.json
      scripts_path: scripts
      profiles_path: profiles
      runtime_root: /sandbox/.hermes
    post_restore:
      kind: managed
      command:
        command: [/usr/local/bin/nemoclaw-state-restore]
        timeout_seconds: 60
      reapply_messaging: false
      restart_runtime: true
      mutable_config: verify
      config_integrity:
        kind: not-required
      settle_device_pairing: false
      notify_gateway_token_change: true

# ── State directories ──────────────────────────────────────────
state_dirs:
  - memories
  # Hermes lazy dependency installs persist across rebuilds.
  - lazy-packages
  - sessions
  - skills
  - plugins
  - cron
  # User-authored cron scripts are part of the job definition contract. Keep
  # them in the same rebuild backup so active jobs never outlive their inputs.
  - scripts
  # Hermes creates this machine-local integration directory. Keep it outside
  # portable snapshot state.
  - path: hooks
    backup: false
  - logs
  - skins
  - plans
  - workspace
  - profiles
  - cache
  - pairing
  # Legacy pre-#7200 dashboard profile location. Keep it in snapshots while
  # startup migrates existing state into profiles/dashboard-home.
  - dashboard-home
  # Hermes' WhatsApp bridge stores QR-paired session credentials under
  # ~/.hermes/platforms/whatsapp/session. Preserve the parent so rebuilds
  # keep the in-sandbox pairing state without re-scanning.
  - platforms
  # Hermes' iLink WeChat adapter persists per-account context tokens under
  # ~/.hermes/weixin/accounts/<id>.context-tokens.json so the long-poll
  # cursor survives a rebuild. The bot token itself comes from .env via
  # the L7 proxy and is not stored on disk inside the sandbox.
  - weixin

# ── Top-level durable state files ───────────────────────────────
# NemoClaw stores Hermes gateway-created top-level state under runtime/ and
# exposes compatibility symlinks such as .hermes/state.db -> runtime/state.db.
# The SQLite database is captured with SQLite's online backup API; WAL/SHM
# files are intentionally omitted because the backup produces a consistent DB.
# .hermes_history is user runtime history: prompt_toolkit appends to it on
# every TUI keypress. It can be removed from this contract if upstream Hermes
# supports redirecting or disabling FileHistory.
state_files:
  - path: SOUL.md
  - path: .hermes_history
  - path: runtime/state.db
    strategy: sqlite_backup
  # Hermes 0.19 records default-profile cron execution history in a separate
  # SQLite ledger. NemoClaw relocates only this mutable database below runtime
  # so cron job definitions remain separate. Named profiles live
  # below profiles/<name>/ and remain part of the raw profiles state-dir
  # capture until dynamic profile-local SQLite discovery is supported.
  - path: runtime/cron-executions.db
    strategy: sqlite_backup
  # Hermes 0.19 uses this default-profile ledger to replay Discord messages
  # after reconnects. Named-profile copies have the same raw-capture limitation
  # described above.
  - path: gateway/discord_message_recovery.db
    strategy: sqlite_backup
  # Hermes' backward-compatible default board lives in this SQLite database.
  # Capture it with the online backup API like runtime/state.db; the zero-byte
  # kanban.db.*.lock files are intentionally omitted. This does not cover named
  # boards, attachments, worker logs, or scratch workspaces under kanban/, nor
  # external dir/worktree workspace targets. Those need a separate durability
  # design before the sibling kanban/ tree can safely enter the state contract.
  - path: kanban.db
    strategy: sqlite_backup
user_managed_files:
  # Relative to /sandbox, not config.dir. Hermes stores user-edited API-key
  # values in /sandbox/.hermes/.env, and rebuild should warn before dropping
  # values outside the allowlisted home-channel preservation inventory.
  - .hermes/.env

# ── Authentication ──────────────────────────────────────────────
# Hermes does NOT have OpenClaw-style browser device pairing.
# Web UI auth is Bearer token via API_SERVER_KEY env var.
# DM pairing for messaging users: `hermes pairing approve <platform> <code>`
device_pairing: false
web_auth_method: bearer_token
web_auth_env: API_SERVER_KEY

# Host provider-broker behavior is package-owned and exposed through NemoClaw's
# fixed receipt-bound adapter and controller protocol.
provider_broker:
  support: managed
  adapter: provider-broker
  operations:
    - describe-provider
    - register-refresh-provider
    - ensure-broker
    - inspect-broker
    - teardown-broker

# One package-owned inference provider entry. NemoClaw owns the picker, secret
# custody, OpenShell registration, and route validation; this package owns the
# provider identity, model catalogue, auth choices, and alias normalization.
provider_auth:
  support: managed
  adapter: provider-auth
  operation: resolve-auth-method
  request_environment:
    - NEMOCLAW_HERMES_AUTH_METHOD
    - NEMOCLAW_HERMES_AUTH
    - NEMOCLAW_NOUS_AUTH_METHOD
  default_method: oauth
  selection:
    key: hermesProvider
    aliases: [hermes, hermes-provider, hermesprovider, nous, nous-portal]
    label: "Hermes Provider (Moonshot, Z-AI, MiniMax, Qwen, Xiaomi, Tencent, StepFun, xAI, Arcee)"
    provider_name: hermes-provider
    provider_type: openai
    endpoint_url: https://inference-api.nousresearch.com/v1
    help_url: https://portal.nousresearch.com/manage-subscription
    preferred_inference_api: openai-completions
    default_model: moonshotai/kimi-k2.6
    models:
      - moonshotai/kimi-k2.6
      - xiaomi/mimo-v2.5-pro
      - xiaomi/mimo-v2.5
      - tencent/hy3-preview
      - anthropic/claude-opus-4.7
      - anthropic/claude-opus-4.6
      - anthropic/claude-sonnet-4.6
      - anthropic/claude-sonnet-4.5
      - anthropic/claude-haiku-4.5
      - openai/gpt-5.5
      - openai/gpt-5.4-mini
      - openai/gpt-5.3-codex
      - google/gemini-3-pro-preview
      - google/gemini-3-flash-preview
      - google/gemini-3.1-pro-preview
      - google/gemini-3.1-flash-lite-preview
      - qwen/qwen3.5-plus-02-15
      - qwen/qwen3.5-35b-a3b
      - stepfun/step-3.5-flash
      - minimax/minimax-m2.7
      - minimax/minimax-m2.5
      - minimax/minimax-m2.5:free
      - z-ai/glm-5.1
      - z-ai/glm-5v-turbo
      - z-ai/glm-5-turbo
      - x-ai/grok-4.20-beta
      - nvidia/nemotron-3-super-120b-a12b
      - arcee-ai/trinity-large-thinking
      - openai/gpt-5.5-pro
      - openai/gpt-5.4-nano
  methods:
    - id: oauth
      label: Nous Portal OAuth (authenticate via browser)
      kind: oauth-device-code
      credential_env: OPENAI_API_KEY
      device_code:
        portal_base_url: https://portal.nousresearch.com
        client_id: hermes-cli
        scope: inference:mint_agent_key
        minimum_credential_ttl_seconds: 1800
    - id: api-key
      label: Nous API Key (paste a key from the provider dashboard)
      kind: api-key
      credential_env: NOUS_API_KEY
      source_env: NOUS_API_KEY
      prompt_label: Nous API Key

# Optional tools served by the package-owned provider broker. NemoClaw owns
# selection and credentials; this package owns names, auth compatibility, and
# the policy presets needed by each selected gateway.
tool_gateways:
  support: managed
  selection_label: Hermes managed Nous tools (OAuth subscription only)
  selection_prompt: Managed tools
  request_environment:
    - NEMOCLAW_HERMES_TOOL_GATEWAYS
    - NEMOCLAW_HERMES_TOOL_GATEWAY_PRESETS
  incompatible_auth_message: Hermes managed tool gateways require Nous Portal OAuth/subscription; API-key mode is inference-only.
  gateways:
    - id: nous-web
      aliases: [web]
      label: Web search/extract
      description: Firecrawl via Nous managed gateway
      default_selected: true
      authentication_methods: [oauth]
      policy_presets: [nous-web]
    - id: nous-image
      aliases: [image]
      label: Image generation
      description: FAL queue via Nous managed gateway
      default_selected: true
      authentication_methods: [oauth]
      policy_presets: [nous-image]
    - id: nous-audio
      aliases: [audio]
      label: Audio TTS/STT
      description: OpenAI-compatible audio via Nous managed gateway
      default_selected: true
      authentication_methods: [oauth]
      policy_presets: [nous-audio]
    - id: nous-browser
      aliases: [browser]
      label: Cloud browser
      description: Browser Use via Nous managed gateway
      default_selected: true
      authentication_methods: [oauth]
      policy_presets: [nous-browser]
    - id: nous-code
      aliases: [code]
      label: Managed code execution
      description: Modal via Nous managed gateway
      default_selected: false
      authentication_methods: [oauth]
      policy_presets: [nous-code]

# ── Web search ──────────────────────────────────────────────────
web_search:
  support: providers
  providers:
    - provider: tavily
      credential_env: TAVILY_API_KEY
      profile_type: tavily-hermes-v1
      config_verification:
        path: /sandbox/.hermes/config.yaml
        format: yaml
        assertions:
          - path: [web, backend]
            equals: tavily
        credential_paths: []
      egress_verification:
        method: POST
        url: https://api.tavily.com/search
        parameters:
          - name: query
            value: NVIDIA
          - name: max_results
            value: 1
        credential:
          kind: json-body
          name: api_key
        result_array_path: [results]
  tool_gateway_conflicts:
    - provider: tavily
      tool_gateway: nous-web

# ── Conversation session operations ─────────────────────────────
sessions:
  operations:
    - list
    - delete
    - export

# ── Skill installation ───────────────────────────────────────────
skills:
  support: managed
  install_root: /sandbox/.hermes/skills
  collision: replace
  removal: remove
  activation:
    kind: new-session

# ── Messaging integration ───────────────────────────────────────
messaging:
  support: channels
  channels:
    - discord
    - googlechat
    - slack
    - teams
    - telegram
    - wechat
    - whatsapp

# ── Inference ───────────────────────────────────────────────────
# Hermes supports custom OpenAI-compatible endpoints natively via
# provider: "custom" + base_url in config.yaml. This is how we
# route through OpenShell's inference.local proxy.
inference:
  context_window_requirements:
    - provider: ollama-local
      minimum_tokens: 64000
  config_update:
    support: mutable
    provider_api_overrides:
      - provider: compatible-anthropic-endpoint
        api: openai-completions
    post_commit:
      config_sync: required
      gateway_restart: not-required
      sandbox_reconcile:
        kind: command
        trigger: after-config-sync
        command:
          - /usr/bin/python3
          - -I
          - /usr/local/lib/nemoclaw/inference-reconcile.py
        timeout_seconds: 30
  provider_type: custom
  base_url_config_key: "model.base_url"
  model_config_key: "model.default"
  proxy_support: implicit # via httpx (OpenAI SDK dep)

# ── Policy UX ───────────────────────────────────────────────────
policy:
  owned_presets:
    - nous-web
    - nous-image
    - nous-audio
    - nous-browser
    - nous-code
    - discord
    - googlechat
    - slack
    - teams
    - telegram
    - wechat
    - whatsapp
  automatic_presets: []
  baseline_exclusion_impacts:
    nvidia: Direct NVIDIA API inference may stop working.
    nous_research: Hermes public metadata lookup and agent updates may stop working.
    pypi: Hermes skill or plugin dependency installation through pip may stop working.

# ── MCP server support ───────────────────────────────────────────
mcp:
  support: bridge
  adapter: hermes-config
  policy_binaries:
    - /usr/local/bin/hermes
    # Hermes runs through its Python console-script interpreter.
    - /usr/bin/python3*
    - /opt/hermes/.venv/bin/python*
  policy_presets:
    - nous-web
    - nous-image
    - nous-audio
    - nous-browser
    - nous-code

# ── Phone-home hosts ───────────────────────────────────────────
# Agent-specific egress endpoints needed for updates, auth, etc.
phone_home_hosts:
  - nousresearch.com
  - hermes-agent.nousresearch.com

# ── Package registry ───────────────────────────────────────────
# Hermes uses pip for plugin/skill installs (replaces npm for OpenClaw).
package_registry:
  hosts:
    - pypi.org
    - files.pythonhosted.org
  binary: /usr/local/bin/pip3
