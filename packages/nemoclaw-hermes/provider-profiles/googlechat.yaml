id: google-chat-hermes-bridge
display_name: Google Chat Bridge (Hermes)
description: Gateway-minted Google Chat token for Hermes Pub/Sub pull and Chat replies
category: agent
credentials:
  - name: access_token
    description: Google Chat bot OAuth access token
    env_vars:
      - GOOGLE_CHAT_ACCESS_TOKEN
    required: true
    auth_style: bearer
    header_name: Authorization
    query_param: ''
    refresh:
      strategy: google_service_account_jwt
      scopes:
        - https://www.googleapis.com/auth/chat.bot
        - https://www.googleapis.com/auth/pubsub
      material:
        - name: client_email
          description: Service-account client email
          required: true
          secret: false
        - name: private_key
          description: Service-account RSA private key
          required: true
          secret: true
        - name: scope
          description: OAuth scopes used to mint the token
          required: false
          secret: false
endpoints:
  - host: pubsub.googleapis.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: chat.googleapis.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /opt/hermes/.venv/bin/python
  - /usr/bin/python3
  - /usr/bin/python3.13
inference_capable: false
