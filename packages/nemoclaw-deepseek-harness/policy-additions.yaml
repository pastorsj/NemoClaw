# The SDK-minimal profile has local shell and editor tools. OpenShell remains
# the authority for filesystem, process identity, and network access.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /opt/nemoclaw-fabric-venv
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
    - /var/lib/dpkg
  read_write:
    - /sandbox
    - /sandbox/.deepseek-harness
    - /tmp
    - /dev/null
landlock:
  compatibility: strict
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  managed_inference:
    name: managed_inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: POST, path: "/v1/completions" }
          - allow: { method: GET, path: "/v1/models" }
          - allow: { method: GET, path: "/v1/models/**" }
    binaries:
      - { path: /opt/nemoclaw-fabric-venv/bin/python3* }
      - {
          path: /opt/nemoclaw-fabric-venv/lib/python3.13/site-packages/deepseek_harness_runtime/runtime/**,
        }
