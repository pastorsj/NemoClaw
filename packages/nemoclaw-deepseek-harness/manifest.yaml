# Local proof-of-concept package. This manifest is not a supported product claim.
name: deepseek-harness
provider_broker:
  support: disabled
  reason: This package does not require a host provider broker.
display_name: "DeepSeek Harness (local POC)"
description: "Headless DeepSeek Harness SDK runtime behind the typed NeMo Fabric boundary"
onboarding:
  sandbox_name: deepseek-harness
version_constraint: ">=0.1.2-rc.1"
language: python
license: MIT
install_method: pip
binary_path: /opt/nemoclaw-fabric-venv/bin/dsh
version_command: "DSH_HOME=/sandbox/.deepseek-harness /opt/nemoclaw-fabric-venv/bin/dsh --version"
expected_version: "0.1.2-rc.1"
version_scheme: semver
runtime:
  kind: terminal
  command_shell: /bin/bash
  headless_environment:
    DEEPSEEK_MANAGED_INFERENCE_ROUTE: nemoclaw-managed-inference
  headless_command: "nemoclaw-fabric-run --deadline-seconds 120 --kill-grace-seconds 10 --config /sandbox/.deepseek-harness/fabric.json"
  prompt_transport: stdin
  prompt_protocol: fabric-cli
  smoke_boundary:
    kind: login-shell
  smoke_commands:
    - "DSH_HOME=/sandbox/.deepseek-harness /opt/nemoclaw-fabric-venv/bin/dsh --version"
    - "nemoclaw-fabric --version"
    - "/usr/local/bin/nemoclaw-fabric-run --help >/dev/null && echo NEMOCLAW_FABRIC_RUNNER_OK"
    - "test -s /sandbox/.deepseek-harness/fabric.json && echo NEMOCLAW_DEEPSEEK_FABRIC_OK"
    - 'test "$(stat -c %a /sandbox/.deepseek-harness/fabric.json)" = 600 && echo NEMOCLAW_DEEPSEEK_MODE_OK'
config:
  dir: /sandbox/.deepseek-harness
  config_file: fabric.json
  mutable_access: private
  format: json
state_lifecycle:
  backup_quiescence:
    kind: not-required
  snapshot_restore: []
  rebuild:
    managed_extensions:
      support: disabled
      reason: DeepSeek Harness does not preserve image-owned extensions during rebuild.
    scheduled_work:
      support: disabled
      reason: DeepSeek Harness does not run scheduled work.
    post_restore:
      kind: not-required
state_dirs:
  - path: sessions
  - path: logs
    backup: false
  - path: cache
    backup: false
device_pairing: false
inference:
  config_update:
    support: unsupported
    reason: The sandbox image owns its Fabric route. Re-onboard to change it.
  provider_type: openai_compatible
  default_model: nvidia/nemotron-3-super-120b-a12b
  base_url_config_key: "models.default.base_url"
  model_config_key: "models.default.model"
  proxy_support: implicit
policy:
  owned_presets: []
  automatic_presets: []
  baseline_exclusion_impacts: {}
mcp:
  support: disabled
sessions:
  operations: []
skills:
  support: disabled
  reason: "This package does not implement DeepSeek Harness skills."
messaging:
  support: disabled
package_registry:
  hosts:
    - pypi.org
    - files.pythonhosted.org
  binary: /opt/nemoclaw-fabric-venv/bin/pip3
