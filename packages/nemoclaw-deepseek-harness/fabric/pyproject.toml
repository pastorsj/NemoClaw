[build-system]
requires = ["setuptools == 82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nemoclaw-deepseek-fabric"
version = "0.1.0"
description = "NemoClaw NeMo Fabric adapter for the DeepSeek Harness SDK"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "deepseek-harness-sdk == 0.1.2rc1",
  "deepseek-harness-runtime-bin == 0.1.2rc1",
  "nemo-fabric-adapter-contract == 0.2.0",
  "nemo-fabric-adapters-common == 0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
