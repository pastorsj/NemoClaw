id: tavily
display_name: Tavily Search
description: Tavily Search API access for the OpenClaw runtime
category: agent
credentials:
  - name: api_key
    description: Tavily Search API key
    env_vars:
      - TAVILY_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ''
endpoints:
  - host: api.tavily.com
    port: 443
    protocol: rest
    enforcement: enforce
    request_body_credential_rewrite: true
    rules:
      - allow: { method: POST, path: "/search" }
      - allow: { method: POST, path: "/extract" }
binaries:
  - /usr/local/bin/node
  - /usr/bin/node
  - /usr/local/bin/curl
  - /usr/bin/curl
inference_capable: false
