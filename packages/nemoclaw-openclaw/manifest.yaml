#
# Agent manifest for OpenClaw.
# Declares the integration contract between NemoClaw and the sandboxed agent.
# This documents the current default agent and owns its image, startup, and
# baseline policy artifacts.

name: openclaw
provider_broker:
  support: disabled
  reason: This package does not require a host provider broker.
display_name: "OpenClaw"
description: "Gateway-based AI agent with plugin ecosystem (openclaw.ai)"
aliases:
  - nemoclaw
  - nemo-claw
alias_summary: ""
onboarding:
  default: true
  sandbox_name: my-assistant
sandbox_create:
  generated_image_build: local-buildkit-required
version_constraint: ">=2026.3.11"
language: nodejs
license: Apache-2.0
homepage: "https://openclaw.ai"

# ── Binary & process ────────────────────────────────────────────
install_method: npm # npm install -g openclaw@<version>
binary_path: /usr/local/bin/openclaw
version_command: "openclaw --version"
expected_version: "2026.7.1"
version_scheme: calendar
managed_image:
  repository: ghcr.io/nvidia/nemoclaw/openclaw-sandbox
  rebuild_base_image: not-required
  architectures:
    - linux/amd64
    - linux/arm64
  runtime_identity:
    uid: 998
    gid: 998
    workdir: /sandbox
  workspace:
    owner: runtime
    mode: "0755"
  state_root:
    mount_target: /sandbox/.openclaw
    mode: "2770"
  startup_profile_environment:
    - { name: NEMOCLAW_AGENT_HEARTBEAT_EVERY, value_type: string, max_bytes: 32 }
    - { name: NEMOCLAW_AGENT_TIMEOUT, value_type: string, max_bytes: 32 }
    - { name: NEMOCLAW_CONTEXT_WINDOW, value_type: string, max_bytes: 32 }
    - { name: NEMOCLAW_EXTRA_AGENTS_JSON, value_type: string, max_bytes: 65536 }
    - { name: NEMOCLAW_EXTRA_AGENTS_JSON_B64, value_type: string, max_bytes: 65536 }
    - { name: NEMOCLAW_INFERENCE_INPUTS, value_type: string, max_bytes: 64 }
    - { name: NEMOCLAW_MAX_TOKENS, value_type: positive-integer, max_bytes: 32 }
    - { name: NEMOCLAW_MINIMAL_BOOTSTRAP, value_type: string, max_bytes: 8 }
    - { name: NEMOCLAW_OPENCLAW_OTEL, value_type: string, max_bytes: 8 }
    - { name: NEMOCLAW_OPENCLAW_OTEL_ENDPOINT, value_type: string, max_bytes: 2048 }
    - { name: NEMOCLAW_OPENCLAW_OTEL_SAMPLE_RATE, value_type: string, max_bytes: 32 }
    - { name: NEMOCLAW_OPENCLAW_OTEL_SERVICE_NAME, value_type: string, max_bytes: 256 }
    - { name: NEMOCLAW_REASONING, value_type: string, max_bytes: 8 }
    - { name: NEMOCLAW_REASONING_EFFORT, value_type: string, max_bytes: 16 }
gateway_command: "openclaw gateway run"
# Interactive entry point a user types inside the sandbox. The explicit runtime
# kind and command let NemoClaw avoid a package-name decision.
runtime:
  kind: gateway
  command_shell: /bin/sh
  interactive_command: "openclaw tui"
  headless_command: "nemoclaw-fabric-run --deadline-seconds 120 --kill-grace-seconds 15 --config /sandbox/.openclaw/fabric.json"
  prompt_transport: stdin
  # Core invokes this package-owned controller with one finite lifecycle action
  # and a core-generated nonce. Core still owns privileged sandbox execution.
  process_lifecycle:
    support: managed
    command: [/usr/local/bin/nemoclaw-gateway-control]
  device_pairing_settlement:
    command: [/usr/local/bin/nemoclaw-device-pairing-settle]
    timeout_seconds: 130
  # OpenClaw owns this native argv grammar. NemoClaw only validates the finite
  # declaration and applies its sandbox execution, output, and timeout policy.
  agent_command:
    argv: [openclaw, agent]
    output_mode: bounded-text
    selector_options: [--agent, --session-id, --session-key, --to]
    selector_required: true
    value_options: [-a, -m, --message, --model, --provider, --reply-channel, --thinking, --timeout]
    boolean_options: [--deliver]
    json_output_option: --json
    timeout_option: --timeout
  smoke_boundary:
    kind: login-shell
  smoke_commands:
    - "openclaw --version"
    - "nemoclaw-fabric --version"
    - "/usr/local/bin/nemoclaw-fabric-run --help >/dev/null && echo NEMOCLAW_FABRIC_RUNNER_OK"
    - "test -s /sandbox/.openclaw/fabric.json && echo NEMOCLAW_OPENCLAW_FABRIC_OK"
    - 'test "$(stat -c %a /sandbox/.openclaw/fabric.json)" = 600 && echo NEMOCLAW_OPENCLAW_FABRIC_MODE_OK'

# ── Health probe ────────────────────────────────────────────────
health_probe:
  url: "http://127.0.0.1:18789/health"
  port: 18789
  timeout_seconds: 30

# ── Dashboard / UI ──────────────────────────────────────────────
dashboard:
  auth: url_token
  token_path: gateway.auth.token
  tunnel_allowed_origins_path: gateway.controlUi.allowedOrigins
forward_ports:
  - 18789

# ── Configuration ───────────────────────────────────────────────
config:
  dir: /sandbox/.openclaw
  config_file: openclaw.json
  format: json

# ── State lifecycle ────────────────────────────────────────────
# The package selects native state semantics. NemoClaw owns archive paths,
# mutation locks, restore transactions, rollback, and runtime-provider access.
state_lifecycle:
  backup_quiescence:
    kind: not-required
  snapshot_restore:
    - repair-mutable-config
  rebuild:
    image_plugin_provenance: required
    scheduled_work:
      support: disabled
      reason: OpenClaw scheduled work does not require a rebuild dispatch gate.
    post_restore:
      kind: managed
      command:
        command: [/usr/local/bin/nemoclaw-state-restore]
        timeout_seconds: 300
      reapply_messaging: true
      restart_runtime: false
      mutable_config: repair
      config_integrity:
        kind: commands
        refresh:
          command: [/usr/local/lib/nemoclaw/seal-config, refresh]
          timeout_seconds: 30
        verify:
          command: [/usr/local/lib/nemoclaw/seal-config, verify]
          timeout_seconds: 30
      settle_device_pairing: true
      notify_gateway_token_change: false

# ── State directories ──────────────────────────────────────────
state_dirs:
  - agents
  - extensions
  # Legacy layouts can still contain this pre-extensions directory. Keep it
  # outside portable state.
  - path: plugins
    backup: false
  # OpenClaw may create profile-scoped runtime state. Keep it outside portable
  # state until profile-specific backup semantics are defined.
  - path: profiles
    backup: false
  - workspace
  # Multi-agent OpenClaw deployments create workspace-<agent> siblings.
  - prefix: workspace-
  - skills
  - hooks
  # Machine-local gateway auth state is wiped on destroy but never captured.
  # Sanitization removes the identity key and paired-device tokens, so a
  # restored copy cannot authenticate (#6852).
  - path: identity
    backup: false
  - path: devices
    backup: false
  - canvas
  - cron
  - memory
  - telegram
  - wechat
  - whatsapp
  - credentials

# ── Top-level durable state files ───────────────────────────────
# openclaw.json holds the core OpenClaw settings the state dirs above do not
# cover: model/provider config, MCP servers, custom agents, and channel
# account blocks. Without this entry `nemoclaw backup-all` snapshotted the
# data directories but dropped these settings, so they were lost on rebuild
# (issue #5027). Backed up with the default copy strategy; the local backup is
# credential-sanitized (gateway section dropped, secret-bearing fields scrubbed)
# while OpenShell `resolve:env` placeholders and the `unused` provider sentinel
# are preserved so the restored config keeps routing through proxy-injected
# credentials.
state_files:
  - path: openclaw.json
    backup:
      fallback: privileged-copy
    restore:
      merge: package-config
user_managed_files:
  - .env
  - .mcp.json

# ── Authentication ──────────────────────────────────────────────
device_pairing: true
web_auth_method: device_pairing

# ── Web search ──────────────────────────────────────────────────
web_search:
  support: providers
  providers:
    - brave
    - tavily

# ── Inference ───────────────────────────────────────────────────
inference:
  sandbox_smoke:
    kind: compatible-endpoint
    config_path: /sandbox/.openclaw/openclaw.json
  refresh_route_for_messaging_providers:
    - compatible-endpoint
  config_update:
    support: mutable
    provider_api_overrides: []
    post_commit:
      config_sync: best-effort
      gateway_restart: when-api-changes
      sandbox_reconcile:
        kind: command
        trigger: when-config-changes
        command:
          - /usr/bin/python3
          - -I
          - /usr/local/lib/nemoclaw/openclaw-startup/inference-reconcile.py
        timeout_seconds: 90
  provider_type: gateway_managed
  proxy_support: explicit # configured in openclaw.json providers block

# ── MCP server support ───────────────────────────────────────────
mcp:
  support: bridge
  adapter: mcporter
  policy_binaries:
    - /usr/local/bin/mcporter
    - /usr/bin/mcporter
    - /usr/local/bin/openclaw
    # npm entrypoints use env to launch Node; OpenShell authorizes the real process binary.
    - /usr/local/bin/node
    - /usr/bin/node

# ── Conversation session operations ─────────────────────────────
sessions:
  operations:
    - list
    - delete
    - reset
    - export

# ── Skill installation ───────────────────────────────────────────
skills:
  support: managed
  install_root: /sandbox/.openclaw/skills
  mirror_root: $HOME/.openclaw/skills
  collision: replace
  removal: remove
  activation:
    kind: reset-session-index
    path: /sandbox/.openclaw/agents/main/sessions/sessions.json

# ── Messaging integration ───────────────────────────────────────
messaging:
  support: channels
  channels:
    - discord
    - googlechat
    - slack
    - teams
    - telegram
    - wechat
    - whatsapp

# ── Phone-home hosts ───────────────────────────────────────────
phone_home_hosts:
  - openclaw.ai
  - docs.openclaw.ai
  - clawhub.ai

# ── Package registry ───────────────────────────────────────────
package_registry:
  hosts:
    - registry.npmjs.org
  binary: /usr/local/bin/npm
