#
# Agent manifest for LangChain Deep Agents Code.
# This is a terminal-oriented harness: there is no long-running gateway or
# dashboard health surface. NemoClaw validates the binary/config and leaves
# interactive/headless execution to the user's sandbox shell.

name: langchain-deepagents-code
display_name: "LangChain Deep Agents Code"
description: "Terminal coding agent built on the Deep Agents SDK"
aliases:
  - nemo-deepagents
  - nemo-deepagent
  - nemodeepagents
  - nemodeepagent
  - dcode
  - deepagent
  - deepagents
  - deep-agent
  - deep-agents
  - deepagentcode
  - deepagentscode
  - deepagent-code
  - deepagents-code
  - deep-agent-code
  - deep-agents-code
  - langchain
  - langchain-code
  - langchaindeepagent
  - langchaindeepagents
  - langchain-deepagent
  - langchain-deepagents
  - langchaindeepagentcode
  - langchaindeepagentscode
  - langchain-deepagent-code
  - langchain-deep-agent
  - langchain-deep-agents
  - langchain-deep-agent-code
  - langchain-deep-agents-code
alias_summary: "nemo-deepagents/dcode/deepagents/deepagents-code/langchain → langchain-deepagents-code"
onboarding:
  sandbox_name: deepagents-code
version_constraint: ">=0.1.55"
language: python
license: MIT
homepage: "https://docs.langchain.com/oss/python/deepagents/code/overview"

# ── Binary & process ────────────────────────────────────────────
install_method: pip
binary_path: /usr/local/bin/dcode
version_command: "dcode --version"
expected_version: "0.1.55"
version_scheme: semver
managed_image:
  repository: ghcr.io/nvidia/nemoclaw/langchain-deepagents-code-sandbox
  architectures:
    - linux/amd64
    - linux/arm64
  runtime_identity:
    uid: 999
    gid: 999
    workdir: /sandbox
  startup_profile_contract_version: 1
  capability_contract_version: 1
runtime:
  kind: terminal
  command_shell: /bin/sh
  interactive_command: "dcode"
  headless_command: "nemoclaw-fabric-run --deadline-seconds 120 --kill-grace-seconds 10 --config /sandbox/.deepagents/fabric.json"
  prompt_transport: stdin
  smoke_boundary:
    kind: managed-launcher
    launcher: /usr/local/lib/nemoclaw/dcode-managed-exec
    home: /usr/local/lib/nemoclaw
  smoke_commands:
    - "dcode --version"
    - "test -s /sandbox/.deepagents/config.toml && echo NEMOCLAW_DEEPAGENTS_CONFIG_OK"
    - "test -s /sandbox/.deepagents/fabric.json && echo NEMOCLAW_FABRIC_CONFIG_OK"
    - "nemoclaw-fabric --version"
    - "/usr/local/bin/nemoclaw-fabric-run --help >/dev/null && echo NEMOCLAW_FABRIC_RUNNER_OK"
    - "timeout --version"
    - 'empty_prompt=; output="$(timeout 10 dcode -n "$empty_prompt" 2>&1)"; status=$?; [ "$status" -eq 2 ] && [ "$output" = "NemoClaw: empty non-interactive prompt for -n; provide prompt text." ] && echo NEMOCLAW_DCODE_EMPTY_PROMPT_OK'

# ── Configuration ───────────────────────────────────────────────
config:
  dir: /sandbox/.deepagents
  config_file: config.toml
  env_file: .env
  mutable_access: private
  shields_files:
    - fabric.json
  format: toml

# ── State directories ──────────────────────────────────────────
# dcode runs with HOME=/sandbox, so its state dirs resolve under
# /sandbox/.deepagents. The built-in skill-creator writes user skills to
# agent/skills (per its init_skill.py), so it must be backed up alongside
# .state and skills — otherwise skills are silently lost on rebuild.
state_dirs:
  - .state
  - skills
  - agent/skills

# ── Top-level durable state files ───────────────────────────────
# config.toml mixes DCode preferences with NemoClaw-managed model routing.
# Ownership is split into three explicit buckets. Users own only the allowlisted
# ui.show_scrollbar, ui.show_url_open_toast, threads.relative_time, and
# threads.sort_order preferences below. NemoClaw owns the fresh models/update
# tables and generated provider headers. Agent-runtime, unknown, executable, and
# security-sensitive backup keys are not restorable and are dropped.
# .env and user-authored .deepagents/.mcp.json content are intentionally omitted
# because they may contain service credentials. NemoClaw writes only direct-HTTP
# bridge endpoint config and OpenShell placeholders to its separate
# .deepagents/.nemoclaw-mcp.json projection, then restores that projection from
# the registry after rebuild. The managed projection is reconstructable state,
# not user-authored durable state.
state_files:
  - path: config.toml
    restore:
      merge: key-allowlist
      require_fresh_tables:
        - models
        - update
      # Checked positionally: the first N leading '#' lines (N = entries below)
      # must match. Further leading comments are safety-checked and preserved.
      require_fresh_headers:
        - "# Generated by NemoClaw. This file contains no provider secrets."
        - match: prefix
          value: "# NemoClaw provider route: "
      user_keys:
        - key: ui.show_scrollbar
          type: boolean
        - key: ui.show_url_open_toast
          type: boolean
        - key: threads.relative_time
          type: boolean
        - key: threads.sort_order
          type: enum
          values:
            - updated_at
            - created_at
user_managed_files:
  - .deepagents/.env
  - .deepagents/.mcp.json

device_pairing: false

# ── Inference ───────────────────────────────────────────────────
# Routes NVIDIA/OpenAI-compatible selections through OpenShell's managed
# inference.local endpoint using Deep Agents Code's OpenAI-compatible provider.
inference:
  provider_type: openai_compatible
  default_model: nvidia/nemotron-3-ultra-550b-a55b
  base_url_config_key: "models.providers.openai.base_url"
  model_config_key: "models.default"
  proxy_support: implicit

# ── MCP server support ───────────────────────────────────────────
mcp:
  support: bridge
  adapter: deepagents-config
  policy_binaries:
    - /usr/local/bin/dcode
    - /opt/venv/bin/python3*

package_registry:
  hosts:
    - pypi.org
    - files.pythonhosted.org
  binary: /opt/venv/bin/pip3
