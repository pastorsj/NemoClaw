# Local POC policy: deny by default and expose only NemoClaw's managed inference route.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /opt/nemoclaw-fabric-venv
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
    - /var/lib/dpkg
  read_write:
    - /sandbox
    - /sandbox/.haystack-agent
    - /tmp
    - /dev/null
landlock:
  compatibility: strict
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  managed_inference:
    name: managed_inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: GET, path: "/v1/models" }
          - allow: { method: GET, path: "/v1/models/**" }
    binaries:
      # NemoClaw status, doctor, and connect probe this route with this fixed path.
      - { path: /usr/bin/curl }
      - { path: /opt/nemoclaw-fabric-venv/bin/python3 }
      - { path: /usr/bin/python3.13 }
